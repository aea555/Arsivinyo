import javax.inject.Inject

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'expo-module-gradle-plugin'

group = 'expo.modules.localdownloader'
version = '1.0.0'

// Faces (shared/memes/CONTRACT.md, "Faces"): ONNX Runtime and the two models.
//
// The runtime's AAR is not a dependency: that would also package its Java bindings and their
// JNI library, which nothing here uses. Only its C headers and libonnxruntime.so are taken
// out of it, the headers for CMake and the library to package. The version is the one
// shared/faces/MODELS.json pins, so the Mac runs the same.
//
// Both land as generated sources (androidComponents below), so every task that reads assets
// or native libraries, lint included, knows to wait for them.
abstract class ExtractOnnxRuntime extends DefaultTask {
  @InputFiles abstract ConfigurableFileCollection getAar()
  @OutputDirectory abstract DirectoryProperty getHeaders()
  @OutputDirectory abstract DirectoryProperty getJni()
  @Inject abstract FileSystemOperations getFiles()
  @Inject abstract ArchiveOperations getArchives()

  @TaskAction
  void extract() {
    def archive = archives.zipTree(aar.singleFile)
    files.sync { from(archive) { include "headers/**"; eachFile { it.path = it.path - "headers/" } }; into headers }
    files.sync { from(archive) { include "jni/*/libonnxruntime.so"; eachFile { it.path = it.path - "jni/" } }; into jni }
  }
}

abstract class CopyFaceModels extends DefaultTask {
  @InputFiles abstract ConfigurableFileCollection getModels()
  @OutputDirectory abstract DirectoryProperty getAssets()
  /** The folder under assets/ they land in. */
  @Input abstract Property<String> getTarget()
  @Inject abstract FileSystemOperations getFiles()

  CopyFaceModels() {
    target.convention("faces")
  }

  @TaskAction
  void copy() {
    files.sync { from(models); into(assets.dir(target)) }
  }
}

// The player (shared/watch/CONTRACT.md, "The player"): libmpv, from the AAR Findroid
// publishes. It brings a libc++_shared.so built with a newer NDK than React Native's, and
// libmpv needs two symbols only the newer one has; none of the app's other libraries uses
// anything the newer one dropped (checked symbol by symbol when this was added). Every
// native build in the app brings React Native's copy, and an AAR's never wins the merge,
// so [useMpvCxxRuntime] puts mpv's in place after it: one runtime in the process, mpv's.
abstract class ExtractCxxRuntime extends DefaultTask {
  @InputFiles abstract ConfigurableFileCollection getAar()
  @OutputDirectory abstract DirectoryProperty getJni()
  @Inject abstract FileSystemOperations getFiles()
  @Inject abstract ArchiveOperations getArchives()

  @TaskAction
  void extract() {
    files.sync { from(archives.zipTree(aar.singleFile)) { include "jni/*/libc++_shared.so"; eachFile { it.path = it.path - "jni/" } }; into jni }
  }
}

def sharedFaces = file("${projectDir}/../../../../shared/faces")
def onnxRuntimeHeaders = layout.buildDirectory.dir("onnxruntime/headers")

configurations {
  onnxRuntime
  mpvRuntime
}

def extractCxxRuntime = tasks.register("extractCxxRuntime", ExtractCxxRuntime) {
  aar.from(configurations.mpvRuntime)
  jni.set(layout.buildDirectory.dir("mpv-cxx/jni"))
}

/** After a native-libs merge, mpv's libc++_shared.so in place of whichever copy it picked. */
ext.useMpvCxxRuntime = { Task task ->
  task.dependsOn(extractCxxRuntime)
  def runtime = extractCxxRuntime.flatMap { it.jni }
  task.doLast {
    def out = task.outputDir.get().asFile
    (runtime.get().asFile.listFiles() ?: []).findAll { it.directory }.each { abi ->
      def target = new File(out, "lib/${abi.name}/libc++_shared.so")
      if (target.parentFile.directory) {
        java.nio.file.Files.copy(new File(abi, "libc++_shared.so").toPath(), target.toPath(),
          java.nio.file.StandardCopyOption.REPLACE_EXISTING)
      }
    }
  }
}

// This module's own test APK, which runs the player.
tasks.matching { it.name ==~ /merge.*AndroidTestNativeLibs/ }.configureEach { useMpvCxxRuntime(it) }

def extractOnnxRuntime = tasks.register("extractOnnxRuntime", ExtractOnnxRuntime) {
  aar.from(configurations.onnxRuntime)
  headers.set(onnxRuntimeHeaders)
  jni.set(layout.buildDirectory.dir("onnxruntime/jni"))
}

def copyFaceModels = tasks.register("copyFaceModels", CopyFaceModels) {
  models.from(fileTree(sharedFaces) { include "MODELS.json", "models/*.onnx" })
  assets.set(layout.buildDirectory.dir("generated/faces-assets"))
}

// CMake reads the headers and links the library straight from where they were unpacked.
tasks.configureEach { task ->
  if (task.name.startsWith("configureCMake") || task.name.startsWith("buildCMake")) {
    task.dependsOn(extractOnnxRuntime)
  }
}

// The fixtures and vectors, for the instrumented test that holds the phone to the Mac.
def copyFaceFixtures = tasks.register("copyFaceFixtures", CopyFaceModels) {
  models.from(fileTree(sharedFaces) { include "VECTORS.json", "fixtures/*.ppm" }.files)
  assets.set(layout.buildDirectory.dir("generated/faces-test-assets"))
  target.set("faces-test")
}

// The player's sample: an MKV with HEVC, AC3, DTS and styled ASS, which the instrumented
// test plays as the watch contract's phase 2 asks.
def copyWatchFixtures = tasks.register("copyWatchFixtures", CopyFaceModels) {
  models.from(fileTree(file("${projectDir}/../../../../shared/watch/fixtures")) { include "*.mkv" })
  assets.set(layout.buildDirectory.dir("generated/watch-test-assets"))
  target.set("watch-test")
}

androidComponents {
  onVariants(selector().all()) { variant ->
    variant.sources.assets?.addGeneratedSourceDirectory(copyFaceModels) { it.assets }
    variant.sources.jniLibs?.addGeneratedSourceDirectory(extractOnnxRuntime) { it.jni }
    variant.androidTest?.sources?.assets?.addGeneratedSourceDirectory(copyFaceFixtures) { it.assets }
    variant.androidTest?.sources?.assets?.addGeneratedSourceDirectory(copyWatchFixtures) { it.assets }
  }
}

android {
  namespace "expo.modules.localdownloader"
  // Match the app module exactly. Without this AGP falls back to its own default NDK
  // version, which is not necessarily one that is installed, and the CMake build then
  // fails for a reason that has nothing to do with the code.
  ndkVersion rootProject.ext.ndkVersion
  defaultConfig {
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    minSdkVersion rootProject.ext.minSdkVersion
    targetSdkVersion rootProject.ext.targetSdkVersion
    versionCode 1
    versionName "1.0.0"

    // Build libaudiopresets.so only for the ABIs the app actually ships. Without this
    // CMake builds every ABI the NDK supports, which is slow and packages code no
    // device here will load. Mirrors the app-level abiFilters that app.plugin.js
    // injects, and reads the same Gradle property so the two cannot drift.
    ndk {
      def audioPresetAbis = (findProperty("reactNativeArchitectures") ?: "arm64-v8a")
          .toString().split(",").collect { it.trim() }.findAll { !it.isEmpty() }
      abiFilters(*audioPresetAbis)
    }

    // Shrinker rules for this module's dependencies. They live here rather than in
    // android/app/proguard-rules.pro because android/ is regenerated by prebuild and
    // would lose them; consumer rules are merged into the app automatically.
    consumerProguardFiles "consumer-rules.pro"
  }

  // The native renderer. This module owns its own CMake build rather than having it
  // injected by app.plugin.js: the plugin exists to modify the GENERATED app project,
  // while this is the module's own source and belongs with it.
  externalNativeBuild {
    cmake {
      path "src/main/cpp/CMakeLists.txt"
      version "3.22.1"
    }
  }
  defaultConfig {
    externalNativeBuild {
      cmake {
        arguments "-DONNXRUNTIME_DIR=${layout.buildDirectory.dir("onnxruntime").get().asFile.absolutePath}"
      }
    }
  }

  sourceSets {
    main {
      jniLibs.srcDirs = ["src/main/jniLibs"]
    }
  }

  packagingOptions {
    // Every native build brings a libc++_shared.so; useMpvCxxRuntime settles which one ships.
    jniLibs.pickFirsts += ["**/libc++_shared.so"]
    // The bundled ffmpeg/ffprobe are executables shipped as .so files; stripping
    // them breaks execution. libaudiopresets.so is a real library and is left to be
    // stripped normally.
    doNotStrip "**/libffmpeg.so"
    doNotStrip "**/libffprobe.so"
  }
}

dependencies {
  onnxRuntime "com.microsoft.onnxruntime:onnxruntime-android:1.30.0@aar"
  // The player: libmpv with FFmpeg and libass (MIT, github.com/jarnedemeulemeester/libmpv-android).
  // Its Kotlin stdlib is left to the app's, which is the one the rest of the module uses.
  implementation("dev.jdtech.mpv:libmpv:1.0.0") { exclude group: "org.jetbrains.kotlin" }
  mpvRuntime "dev.jdtech.mpv:libmpv:1.0.0@aar"
  implementation "androidx.core:core-ktx:1.13.1"
  implementation "androidx.activity:activity-ktx:1.9.2"
  implementation "androidx.biometric:biometric:1.1.0"
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
  implementation "com.google.crypto.tink:tink-android:1.13.0"
  implementation "org.nanohttpd:nanohttpd:2.3.1"
  // Argon2id for the backup container's key derivation. Only the lightweight
  // `org.bouncycastle.crypto.*` API is used — the JCE provider is deliberately NOT
  // registered, because Android ships its own repackaged BouncyCastle and installing a
  // second provider is a known source of conflicts. R8 keeps the reachable classes only.
  implementation "org.bouncycastle:bcprov-jdk18on:1.79"
  compileOnly "com.chaquo.python.runtime:chaquopy_java:15.0.1"

  testImplementation "junit:junit:4.13.2"
  testImplementation "com.google.crypto.tink:tink:1.13.0"
  // The android.jar used for unit tests stubs org.json with methods that throw, so the
  // real implementation has to be on the test classpath for the header codec to run.
  testImplementation "org.json:json:20240303"
  // Building a self-signed certificate, for the JVM tests only. On a device the TLS key
  // is generated in the Android Keystore, which issues its own certificate, so this never
  // reaches the APK — `testImplementation`, not `implementation`.
  testImplementation "org.bouncycastle:bcpkix-jdk18on:1.79"
  testImplementation "org.bouncycastle:bcutil-jdk18on:1.79"

  // The session TLS key lives in the Android Keystore, which is a platform provider and
  // does not exist off a device. Its tests therefore have to be instrumented ones.
  // Only the runner that launches instrumented tests — the tests themselves are plain
  // JUnit and need no Context, so nothing else from androidx.test is pulled in.
  androidTestImplementation "androidx.test:runner:1.6.2"
}
